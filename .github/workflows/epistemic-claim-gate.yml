name: Epistemic Claim Gate

on:
  pull_request:
  push:
    branches:
      - esrm-gate1-source-extraction-v1

jobs:
  validate-claim-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Validate epistemic claim gate
        run: python gate1/tools/validate_claim_gate.py
