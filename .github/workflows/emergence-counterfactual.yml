name: Emergence counterfactual lab

on:
  pull_request:
    paths:
      - 'research/emergence_layer/**'
      - 'proofrail/**'
      - 'schemas/**'
      - 'pyproject.toml'
      - '.github/workflows/emergence-counterfactual.yml'
  push:
    branches: [main]
    paths:
      - 'research/emergence_layer/**'
      - 'proofrail/**'
      - 'schemas/**'
      - 'pyproject.toml'
      - '.github/workflows/emergence-counterfactual.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  counterfactual:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    defaults:
      run:
        working-directory: research/emergence_layer
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install research dependencies
        run: python -m pip install ../.. -r requirements-dev.txt
      - name: Run signed-handoff and crash regression tests
        run: python -m pytest -q tests/ --junitxml=execution-test-results.xml
      - name: Reproduce all counterfactual observations
        run: |
          python counterfactual_lab.py --output reproduced-results.json
          diff -u counterfactual_results.json reproduced-results.json
      - name: Run the buyer demonstration and verify its exported evidence
        run: |
          python buyer_demo/run_demo.py --workdir "$RUNNER_TEMP/demo-work" --evidence buyer-demo-evidence
          python buyer_demo/verify_evidence.py buyer-demo-evidence
      - uses: actions/upload-artifact@v7
        with:
          name: emergence-evidence-python-${{ matrix.python-version }}
          path: |
            research/emergence_layer/reproduced-results.json
            research/emergence_layer/execution-test-results.xml
            research/emergence_layer/buyer-demo-evidence/
          if-no-files-found: error
          retention-days: 30
