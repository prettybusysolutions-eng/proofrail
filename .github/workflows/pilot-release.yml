name: Publish tested pilot
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/pilot-release.yml
      - pyproject.toml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: proofrail-pilot-release
  cancel-in-progress: false
jobs:
  publish-pilot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test exact source
        run: |
          python -m pip install build
          python -m pip install -e .
          python -m unittest discover -s tests -v
          python scripts/generate_validation_report.py --out /tmp/VALIDATION_REPORT.md --evidence-out /tmp/validation-results.json
          diff -u VALIDATION_REPORT.md /tmp/VALIDATION_REPORT.md
          diff -u validation-results.json /tmp/validation-results.json
      - name: Build and test installed release artifact
        run: |
          python -m build
          python -m venv "$RUNNER_TEMP/release-wheel"
          "$RUNNER_TEMP/release-wheel/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/release-wheel/bin/python" scripts/verify_installed_artifact.py examples/reproduce_artifact
          proofrail reproduce examples/reproduce_artifact
      - name: Package frozen independent-review inputs
        run: |
          python scripts/package_independent_review.py --output "$RUNNER_TEMP/independent-review-inputs"
          python - <<'PY'
          import os, shutil
          shutil.make_archive("dist/independent-review-inputs", "zip", os.environ["RUNNER_TEMP"]+"/independent-review-inputs")
          PY
      - name: Record source and checksums
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, tomllib
          dist = pathlib.Path('dist')
          version = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version']
          artifacts = {p.name: hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(dist.iterdir()) if p.is_file()}
          (dist/'SHA256SUMS').write_text(''.join(f'{digest}  {name}\n' for name,digest in artifacts.items()))
          (dist/'provenance.json').write_text(json.dumps({'version':version,'source_commit':os.environ['GITHUB_SHA'], 'repository':os.environ['GITHUB_REPOSITORY'], 'workflow_run':os.environ['GITHUB_RUN_ID'], 'artifacts':artifacts, 'status':'tested pilot; independent semantic review and external reproduction pending', 'signature':'unsigned workflow metadata'},indent=2)+'\n')
          pathlib.Path('/tmp/release-tag').write_text('v'+version)
          PY
      - name: Publish idempotent exact-commit pilot release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$(cat /tmp/release-tag)"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists; refusing to replace its tag or assets."
            exit 1
          fi
          cat > /tmp/release-notes.md <<EOF
          Tested ProofRail pilot reference implementation from commit $GITHUB_SHA.

          Includes installable wheel, source distribution, SHA256SUMS and unsigned workflow provenance metadata. CI runs the test suite and installed-wheel reproduction with tamper rejection before publication.

          Independent semantic review, independently authored external reproduction, production key custody and operational hardening remain incomplete. This release does not certify those gates.
          EOF
          gh release create "$tag" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "ProofRail $tag tested pilot" --prerelease --notes-file /tmp/release-notes.md
